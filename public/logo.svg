<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <linearGradient id="goldOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="distress">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#distress)">
    <circle cx="100" cy="100" r="84" fill="none" stroke="#18181b" stroke-width="18"/>
    <circle cx="100" cy="100" r="84" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="14 6 4 8"/>
    <line x1="38" y1="162" x2="162" y2="38" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="url(#goldOrbit)" stroke-width="7.5">
    <ellipse cx="100" cy="100" rx="82" ry="30" transform="rotate(-30 100 100)"/>
    <ellipse cx="100" cy="100" rx="82" ry="30" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="30" ry="82"/>
  </g>
  <circle cx="100" cy="100" r="19" fill="url(#goldCore)" stroke="#451a03" stroke-width="2"/>
</svg>
